
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calculator">
        <h2>Калькулятор</h2>

        <label for="num1">Перше число:</label>
        <input type="text" id="num1" placeholder="Введіть число">

        <label for="num2">Друге число:</label>
        <input type="text" id="num2" placeholder="Введіть число">

        <div class="screen">
            <p>Результат:</p>
            <h2 id="result">0</h2>
        </div>

        <div class="buttons">
            <button id="clear" class="clear">C</button>
            <button id="back">←</button>
            <button id="switch">⇄</button>
            <button class="operation" data-op="/">÷</button>

            <button data-num="7">7</button>
            <button data-num="8">8</button>
            <button data-num="9">9</button>
            <button class="operation" data-op="*">×</button>

            <button data-num="4">4</button>
            <button data-num="5">5</button>
            <button data-num="6">6</button>
            <button class="operation" data-op="-">−</button>

            <button data-num="1">1</button>
            <button data-num="2">2</button>
            <button data-num="3">3</button>
            <button class="operation" data-op="+">+</button>

            <button data-num="0">0</button>
            <button data-num=".">.</button>
            <button id="sign">+/-</button>
            <button id="equal" class="equal">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
